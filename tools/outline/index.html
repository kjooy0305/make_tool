<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>계층형 아이디어 정리 · make_tool</title>
<link rel="stylesheet" href="../../assets/style.css">
<style>
.wrap{max-width:1200px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:800px){.cols{grid-template-columns:1fr}}
textarea{width:100%;min-height:60vh;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:14px/1.6 ui-monospace,Menlo,Consolas,"D2Coding",monospace;resize:vertical;tab-size:2}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:14px;min-height:60vh;overflow:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;align-items:center}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);cursor:pointer}
button:hover{border-color:var(--acc);color:var(--acc)}
.stat{color:var(--mut);font-size:13px;margin-left:auto}
.hint{color:var(--mut);font-size:13px;margin:8px 0 0}
ul.tree,ul.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px solid var(--line)}
ul.tree{padding-left:0;border:0}
.node{display:flex;gap:6px;align-items:flex-start;padding:2px 0}
.tog{flex:none;width:18px;height:22px;border:0;padding:0;background:none;color:var(--mut);cursor:pointer;font-size:11px}
.tog.leaf{visibility:hidden}
.txt{white-space:pre-wrap;word-break:break-word}
li.closed>ul{display:none}
.cnt{color:var(--mut);font-size:12px;margin-left:4px}
label.opt{font-size:13px;color:var(--mut);display:flex;gap:4px;align-items:center}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="back" href="../../">← 목록</a><h1>계층형 아이디어 정리</h1></header>
  <div class="cols">
    <div>
      <div class="bar">
        <button id="clear">비우기</button>
        <button id="sample">예시</button>
        <label class="opt"><input type="checkbox" id="optL" checked> 맨 앞 <code>l</code>/<code>|</code>를 들여쓰기로</label>
      </div>
      <textarea id="src" spellcheck="false" placeholder="여기에 붙여넣기&#10;&#10;지원: 탭, 공백 들여쓰기, ㄴ / ㄴㄴ, └ ├, l | (세로선), - * • 불릿, 1. 번호"></textarea>
      <p class="hint">길이나 깊이 제한 없음. 붙여넣으면 바로 오른쪽에 트리로 정리됩니다.</p>
    </div>
    <div>
      <div class="bar">
        <button id="expand">모두 펼치기</button>
        <button id="collapse">모두 접기</button>
        <button data-lv="1">1단계</button><button data-lv="2">2단계</button><button data-lv="3">3단계</button>
        <span class="stat" id="stat"></span>
      </div>
      <div class="bar">
        <span style="font-size:13px;color:var(--mut)">복사:</span>
        <button data-copy="tab">탭 들여쓰기</button>
        <button data-copy="md">마크다운</button>
        <button data-copy="ㄴ">ㄴ 형식</button>
        <button data-copy="num">번호(1.1.2)</button>
      </div>
      <div class="panel"><ul class="tree" id="tree"></ul></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="outline.js"></script>
</body>
</html>
